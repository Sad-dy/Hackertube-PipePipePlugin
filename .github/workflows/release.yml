name: Release Plugin Repository

# Builds, signs and uploads the .ppp package and index.json to a fixed "repo" release.
# Add this URL in PipePipe Settings -> Plugins -> Add repository:
#   https://github.com/<owner>/<repo>/releases/download/repo/index.json

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0" "platforms;android-36"
      - name: Run unit tests
        run: ./gradlew test
      - name: Build, sign and index
        env:
          PIPEPIPE_SIGNING_KEY: ${{ secrets.PIPEPIPE_SIGNING_KEY }}
        run: |
          test -n "$PIPEPIPE_SIGNING_KEY" || { echo "Secret PIPEPIPE_SIGNING_KEY is not set. Run ./gradlew :tools:genKey locally or in CI setup and store signing.key contents in repository secret PIPEPIPE_SIGNING_KEY."; exit 1; }
          umask 077
          printf '%s' "$PIPEPIPE_SIGNING_KEY" > "$RUNNER_TEMP/signing.key"
          ./gradlew :tools:index -PpluginSigningKey="$RUNNER_TEMP/signing.key"
          rm -f "$RUNNER_TEMP/signing.key"
      - name: Upload packages and index to GitHub Release
        working-directory: build/repo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view repo > /dev/null 2>&1; then
            gh release create repo --target "$GITHUB_SHA" --title "HackerTube PipePipe Plugin Repository" \
              --notes "Signed .ppp packages and index.json for PipePipe."
          fi
          # Upload .ppp files before index.json so index.json never points at an unuploaded asset.
          gh release upload repo ./*.ppp --clobber
          gh release upload repo index.json --clobber
